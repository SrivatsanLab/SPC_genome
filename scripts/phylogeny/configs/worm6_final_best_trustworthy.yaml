# Same as worm6_final_best but restricts clade_matching to trustworthy clades.
# Reuses the panels + trees output from worm6_final_best (name matches).
# Output lands at clade_matching_trustworthy/ so it sits alongside the full-set run.
name: worm6_final_best

inputs:
  adata: ../../../results/worm6_final/DNA_analysis/joint_variants_process.h5ad

output_root: ../../../results/worm6_final/DNA_analysis/phylogeny

clade_matching:
  trustworthy_only: true
